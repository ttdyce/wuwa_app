          <p style="color: rgb(28, 43, 51); line-height: 2;" data-block="true" data-editor="aqkmj" data-offset-key="bnv5f-0-0"><span style="font-size: 14pt; font-family: 微软雅黑; color: rgb(255, 255, 255);" data-offset-key="bnv5f-0-0"><span data-text="true">資料讀取中&gt;&gt;&gt;</span></span></p>
          <p style="text-align: left; line-height: 2;" data-offset-key="4u4kr-0-0"><span style="font-size: 14pt; font-family: 微软雅黑; color: rgb(255, 255, 255);" data-offset-key="4u4kr-0-0"><span data-text="true">✦珂萊塔✦</span></span></p>
          <p style="text-align: left; line-height: 2;" data-offset-key="2c2lh-0-0"><span style="font-size: 14pt; font-family: 微软雅黑; color: rgb(255, 255, 255);" data-offset-key="2c2lh-0-0"><span data-text="true">莫塔里家族的二小姐，不被教條限制的藝術投資人。明面上，珂萊塔遊走在交際與交易中，暗地裡，她則為家族處理著不可明說的「麻煩」。</span></span></p>
          <p style="color: rgb(28, 43, 51); line-height: 2;" data-block="true" data-editor="aqkmj" data-offset-key="pj70-0-0"><span style="font-size: 14pt; font-family: 微软雅黑; color: rgb(255, 255, 255);" data-offset-key="pj70-0-0"><span data-text="true">一顆「寶石」的綻放，一場生命的凋零，她以自我為名，給予現實另一向度的重塑。</span></span></p>
