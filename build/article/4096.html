        <div class="article-content">
          <div>
          <div>
          <p data-zone-id="0" data-line-index="0" data-line="true">漂泊者過去在星炬學院的著裝。黑白色的主題加以金色線條來點綴，將模糊的過去點綴成珍貴的回憶，將即赴的未來點綴得觸手可及。</p>
          <p data-zone-id="0" data-line-index="1" data-line="true">漂泊者高級訂製「星火永明」將在3.1版本更新後上線，來看看服飾的細節吧。</p>
          <p data-zone-id="0" data-line-index="2" data-line="true">&nbsp;</p>
          <p data-zone-id="0" data-line-index="3" data-line="true">✦獲取方式✦</p>
          <p data-zone-id="0" data-line-index="4" data-line="true">3.1版本更新後，「星炬予你」活動將永久開放。完成潮汐任務第三章第三幕「遠航星」，可在活動頁面免費領取漂泊者高級訂製服飾「星火永明」和對應頭像。</p>
