          <p style="line-height: 2;"><span style="font-size: 14pt; font-family: 微软雅黑; color: rgb(255, 255, 255);">- 2025年1月23日10:00~2025年2月13日03:59（伺服器時間）期間，參與[刃舞候春歸]夥伴邀約簽到活動，可免費領取散華服飾「叱妖誥」。</span><br><span style="font-size: 14pt; font-family: 微软雅黑; color: rgb(255, 255, 255);">- 活動結束後，散華高級訂製「叱妖誥」將在下個版本永久上架服飾商城，售價1680月相。</span></p>
