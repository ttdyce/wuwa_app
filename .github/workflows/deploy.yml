name: Build and Deploy

on:
  schedule:
    # Twice daily at 04:00 and 13:00 UTC (12:00 and 21:00 UTC+8)
    - cron: '0 4,13 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get

      - name: Fetch articles
        run: dart run tool/fetch_articles.dart

      - name: Build site
        run: dart run lib/main.dart

      - name: Commit updated data and build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ build/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "auto: update data/ and build/ [skip ci]"
            git push
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
